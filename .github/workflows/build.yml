name: Build Firmware

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install ARM GCC toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

    # The Release/ makefiles are generated by STM32CubeIDE on the developer's machine.
    # Make them buildable with the stock Ubuntu toolchain.
    - name: Fix up CubeIDE makefiles
      working-directory: Release
      run: |
        # ST-only compiler flag that upstream arm-none-eabi-gcc rejects
        find . -name 'subdir.mk' -exec sed -i 's/ -fcyclomatic-complexity//g' {} +
        # absolute Windows path to the linker script -> relative
        sed -i -E 's#[A-Za-z]:\\[^ "]*\\STM32F411CEUX_FLASH\.ld#../STM32F411CEUX_FLASH.ld#g' makefile
        # objects.list is written by CubeIDE, not by make - regenerate it from $(OBJS)
        printf 'print-objs:\n\t@printf "\\"%%s\\"\\n" $(OBJS)\n' > /tmp/printobjs.mk
        make -s -f makefile -f /tmp/printobjs.mk print-objs > objects.list

    - name: Build firmware
      run: |
        cd Release
        make -j$(nproc) all
        arm-none-eabi-objcopy -O binary CC1200_HAT-fw.elf CC1200_HAT-fw.bin

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ github.sha }}
        path: |
          Release/CC1200_HAT-fw.bin
          Release/CC1200_HAT-fw.elf

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: firmware-${{ github.sha }}
        path: Release/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          Release/CC1200_HAT-fw.bin
          Release/CC1200_HAT-fw.elf
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
